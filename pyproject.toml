[project]
name = "deixis-vacuum"
version = "0.2.0"
description = "Send an ECOVACS DEEBOT robot vacuum to clean a box on its map (the vacuum adapter for deixis-doodle), from Python or as an MCP server"
readme = "README.md"
license = "GPL-3.0-or-later"
# deebot-client 18.x ships Windows wheels for CPython 3.14 only
requires-python = ">=3.14"
dependencies = [
    "deebot-client>=18.6,<19",
    "aiohttp>=3.14",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
deixis-vacuum-mcp = "vacuum_mcp:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["vacuum", "vacuum_mcp", "fake_robot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
